# Created for EVERY storage mode (RADD-1525). With S3 attachments it still holds
# the encryption key (RADD_BACKUP_KEY_FILE) and /data/scripts, so it is small
# (storage.stateSize) rather than absent.
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: {{ .Release.Name }}-data
  labels:
    {{- include "radd.labels" . | nindent 4 }}
spec:
  accessModes:
    - ReadWriteOnce
  {{- with .Values.storage.storageClassName }}
  storageClassName: {{ . }}
  {{- end }}
  resources:
    requests:
      storage: {{ ternary .Values.storage.stateSize .Values.storage.size .Values.storage.s3 }}
{{- if .Values.backups.enabled }}
---
# Backup artifacts (spec 99). Separate from -data on purpose: the encryption
# key lives on -data, and one stolen or lost volume must not yield both. Point
# this at a storage class backed by a different disk from the database.
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: {{ .Release.Name }}-backups
  labels:
    {{- include "radd.labels" . | nindent 4 }}
spec:
  accessModes:
    - ReadWriteOnce
  {{- with .Values.backups.storageClassName }}
  storageClassName: {{ . }}
  {{- end }}
  resources:
    requests:
      storage: {{ .Values.backups.size }}
{{- end }}

---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: {{ .Release.Name }}-plugins
  labels:
    {{- include "radd.labels" . | nindent 4 }}
spec:
  accessModes:
    - {{ .Values.plugins.accessMode }}
  {{- with .Values.plugins.storageClassName }}
  storageClassName: {{ . }}
  {{- end }}
  resources:
    requests:
      storage: {{ .Values.plugins.size }}
