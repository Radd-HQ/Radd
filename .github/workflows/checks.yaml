# Contribution checks (RADD-1127). Runs on every pull request, on pushes to
# main and on demand — the same gates a release goes through, on GitHub's
# disposable runners. No secrets, read-only token: fork code executes here and
# nowhere near the cluster runner that holds deployment credentials.
name: checks

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch: {}
  workflow_call: {}

permissions:
  contents: read

concurrency:
  group: checks-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: backend (ruff, pytest)
    runs-on: ubuntu-latest
    services:
      # Plain postgres:16, not the pgvector image the dev stack uses: the
      # pgvector migration is guarded and the pgvector-dependent tests self-skip
      # on a plain server — the same thing a contributor's laptop runs.
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: radd
          POSTGRES_PASSWORD: radd
          POSTGRES_DB: radd_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U radd -d radd_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
          cache-dependency-glob: server/uv.lock
      - name: Install
        working-directory: server
        run: uv sync --locked
      - name: Lint (ruff)
        working-directory: server
        run: uv run ruff check src
      - name: Test (pytest)
        working-directory: server
        env:
          # conftest re-creates and migrates this throwaway database itself.
          RADD_TEST_DATABASE_URL: postgresql+psycopg://radd:radd@localhost:5432/radd_test
        run: uv run pytest -q

  # RADD-1526: the two operations an operator performs on their worst day, run
  # for real. `docs/deploy.md` makes restore the only rollback path, and before
  # this nothing called it; migrations had only ever run on an EMPTY database.
  drills:
    name: drills (client ${{ matrix.client }} → server 16)
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # 17 is the client major the IMAGE ships (Containerfile: postgresql-client-17);
        # 16 is the one that matches the server. RADD-1543: with only the matching
        # one tested, a newer client that could not restore went unnoticed.
        # tests/test_backup_tool_majors.py refuses a Containerfile major missing here.
        client: [16, 17]
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: radd
          POSTGRES_PASSWORD: radd
          POSTGRES_DB: radd_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U radd -d radd_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    env:
      # Each drill drops and re-creates its own `radd_drill` on this server.
      RADD_DRILL_DATABASE_URL: postgresql+psycopg://radd:radd@localhost:5432/radd_test
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
          cache-dependency-glob: server/uv.lock
      - name: Install
        working-directory: server
        run: uv sync --locked
      - name: PostgreSQL ${{ matrix.client }} client tools
        working-directory: server
        run: |
          sh scripts/pg_client_shims.sh ${{ matrix.client }} /tmp/pgclient
          {
            echo "RADD_BACKUP_PG_DUMP_PATH=/tmp/pgclient/pg_dump"
            echo "RADD_BACKUP_PG_RESTORE_PATH=/tmp/pgclient/pg_restore"
            echo "RADD_BACKUP_PSQL_PATH=/tmp/pgclient/psql"
          } >> "$GITHUB_ENV"
      - name: Restore drill (backup, empty database, restore, compare every table)
        working-directory: server
        run: uv run python scripts/drills.py restore
      - name: Upgrade drill (the previous release's data, alembic upgrade head, boot the app)
        working-directory: server
        run: uv run python scripts/drills.py upgrade

  frontend:
    name: frontend (tests, host + plugin builds, Chromium smoke)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Install
        working-directory: web
        run: npm ci
      # Four mocked proofs (audit-entity-links, automation-editor, vcs-settings,
      # second-review) derive their fixtures from the BACKEND's own contracts by
      # spawning server/.venv/bin/python, so the frontend job carries the server
      # venv too (RADD-1470). No database: the fixtures read registries only.
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
          cache-dependency-glob: server/uv.lock
      - name: Install the server for the contract proofs
        working-directory: server
        run: uv sync --locked
      # `npm run check` = the JS regressions, the host build, every plugin
      # remote's build, then the browser smoke and autocomplete proofs. The
      # runner image ships Google Chrome at the path web/scripts/lib/chrome.mjs
      # probes; RADD_CHROME pins it so a runner image change fails loudly here
      # rather than silently picking another binary.
      - name: Check
        working-directory: web
        env:
          RADD_CHROME: /usr/bin/google-chrome
        run: npm run check
