[project]
name = "radd-server"
version = "0.1.0"
description = "Radd — self-hosted, AI-native work tracking. Server."
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "sqlalchemy>=2.0.36",
    "psycopg[binary]>=3.2",
    "alembic>=1.14",
    "pydantic>=2.9",
    "pydantic-settings>=2.6",
    "httpx>=0.27",
    "pwdlib[argon2]>=0.3.0",
    "python-multipart>=0.0.32",
    "minio>=7.2.20",
    "pyjwt[crypto]>=2.13.0",
    "ldap3>=2.9.1",
]

[project.optional-dependencies]
localembed = [
    "fastembed>=0.8.0",
]

[dependency-groups]
dev = ["ruff>=0.8", "pytest>=8.3", "pytest-asyncio>=0.25"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/radd"]

[tool.ruff]
line-length = 100
src = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
