# Build the app image on a version tag and push it to the Forgejo registry, so
# deployments pull an immutable, CI-built artifact instead of one hand-built on
# the node.
#
#   git tag v0.2.0 && git push --tags     -> git.radd-hq.com/radd/radd:0.2.0
#
# Plain `docker` commands rather than docker/build-push-action: Forgejo resolves
# actions from its own mirror, third-party GitHub actions are not guaranteed to
# be there, and a build that fails on a missing action is a confusing way to
# find that out.
name: publish

on:
  push:
    tags:
      - "v*"
  # Rebuild a version without moving a tag (e.g. after a base-image CVE).
  workflow_dispatch:
    inputs:
      version:
        description: "Version to build, without the leading v (e.g. 0.2.0)"
        required: true

env:
  REGISTRY: git.radd-hq.com

jobs:
  image:
    runs-on: docker
    container:
      # Our own runner image (RADD-807): node for actions/checkout, the docker
      # CLI for build/push, python3 for release_notes.py, syft for the SBOMs,
      # trivy for the vulnerability reports — all baked in, so a release no
      # longer depends on download.docker.com answering. Pinned to an exact
      # version; bump deploy/ci-runner.version and rebuild to move it.
      image: git.radd-hq.com/radd/ci-runner:1.2.0
    steps:
      - uses: actions/checkout@v4

      - name: Resolve version and image name
        id: meta
        run: |
          set -e
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            VERSION="${{ inputs.version }}"
          else
            VERSION="${GITHUB_REF_NAME#v}"      # refs/tags/v0.2.0 -> 0.2.0
          fi
          # Container repository names MUST be lowercase; the Forgejo repo is
          # "Radd/Radd", which docker rejects verbatim.
          REPO="$(echo "${{ github.repository }}" | tr '[:upper:]' '[:lower:]')"
          echo "version=$VERSION"            >> "$GITHUB_OUTPUT"
          echo "image=$REGISTRY/$REPO"       >> "$GITHUB_OUTPUT"
          echo "Building $REGISTRY/$REPO:$VERSION"

      - name: Log in to the registry
        run: |
          echo "${{ secrets.REGISTRY_TOKEN || secrets.FORGEJO_TOKEN }}" \
            | docker login "$REGISTRY" -u "${{ github.actor }}" --password-stdin

      - name: Build
        # DOCKER_HOST points at the runner's DinD sidecar over its bridge
        # gateway — job containers sit on that bridge, so localhost is not it.
        env:
          DOCKER_HOST: tcp://172.17.0.1:2375
        run: |
          set -e
          docker build -f Containerfile \
            -t "${{ steps.meta.outputs.image }}:${{ steps.meta.outputs.version }}" .
          docker images "${{ steps.meta.outputs.image }}" --format '  {{.Repository}}:{{.Tag}}  {{.Size}}'

      - name: Push
        env:
          DOCKER_HOST: tcp://172.17.0.1:2375
        run: |
          docker push "${{ steps.meta.outputs.image }}:${{ steps.meta.outputs.version }}"

      # RADD-703/704: the tag also publishes its changelog — a categorized
      # Forgejo release and a page under Radd -> Release notes. The LOGIC lives
      # in scripts/changelog.py (categories come from each [RADD-###] issue's
      # type + labels, never from a parsed commit prefix); this step is three
      # lines on purpose, because a shell pipeline in YAML cannot be tested and
      # would drift from the page generator immediately.
      #
      # Never fails the build: the image is already pushed and deployable, and a
      # tracker or wiki that happens to be down must not turn a good release
      # into a red one. The script says which half failed.
      - name: Publish the changelog
        continue-on-error: true
        env:
          RADD_API_TOKEN: ${{ secrets.RADD_API_TOKEN }}
          FORGEJO_TOKEN: ${{ secrets.RELEASE_TOKEN || secrets.FORGEJO_TOKEN }}
          FORGEJO_REPO: ${{ github.repository }}
        run: |
          git fetch --tags --force --unshallow 2>/dev/null || git fetch --tags --force
          python3 scripts/release_notes.py --tag "v${{ steps.meta.outputs.version }}"

      # RADD-1026: every shipped version carries its bill of materials — two
      # CycloneDX documents attached to the Forgejo release. TWO because the
      # runtime image only carries the BUILT web bundle: scanning the image
      # yields Debian + Python (+ the Rust crates syft reads out of binaries
      # like uv), and nothing in it can see the npm tree, so the frontend is
      # cataloged from web/package-lock.json (dev dependencies excluded).
      # release_assets.py find-or-creates the release, so this step does not
      # depend on the changelog step above having succeeded.
      #
      # continue-on-error for the changelog step's reason: the image is already
      # pushed and deployable, and a failed SBOM must not turn a good release
      # red. The gap is visible where it matters — on the release page.
      - name: Generate and attach SBOMs
        continue-on-error: true
        env:
          DOCKER_HOST: tcp://172.17.0.1:2375
          FORGEJO_TOKEN: ${{ secrets.RELEASE_TOKEN || secrets.FORGEJO_TOKEN }}
          FORGEJO_REPO: ${{ github.repository }}
          # Package inventory, not a five-thousand-row file listing.
          SYFT_FILE_METADATA_SELECTION: none
        run: |
          set -e
          V="${{ steps.meta.outputs.version }}"
          syft "docker:${{ steps.meta.outputs.image }}:$V" \
            -o cyclonedx-json="radd-$V-image.cdx.json" -q
          syft file:web/package-lock.json \
            -o cyclonedx-json="radd-$V-web.cdx.json" -q
          python3 scripts/release_assets.py --tag "v$V" \
            "radd-$V-image.cdx.json" "radd-$V-web.cdx.json"

      # RADD-1028: the inventory above, read for known vulnerabilities — the
      # same two-target split for the same reason (no image scan can see the
      # npm tree; trivy fs excludes npm devDependencies by default, matching
      # the SBOMs). Report-only BY DESIGN: most base-image CVEs carry no fix,
      # and the remedy for a fixable one is the workflow_dispatch rebuild
      # above, not a blocked tag. The JSON attaches to the release; the log
      # gets a CRITICAL/HIGH table via `trivy convert`, which re-reads the
      # JSON instead of scanning twice. The DB fetch at scan time is the one
      # runtime download in either pipeline — it rides the OCI registry
      # protocol (ghcr.io), the single network path RADD-807 kept, because a
      # DB baked into the runner would be stale by the first scan.
      - name: Vulnerability scan
        continue-on-error: true
        env:
          DOCKER_HOST: tcp://172.17.0.1:2375
          FORGEJO_TOKEN: ${{ secrets.RELEASE_TOKEN || secrets.FORGEJO_TOKEN }}
          FORGEJO_REPO: ${{ github.repository }}
        run: |
          set -e
          V="${{ steps.meta.outputs.version }}"
          trivy image --scanners vuln -q \
            -f json -o "radd-$V-image-vulns.json" \
            "${{ steps.meta.outputs.image }}:$V"
          trivy fs --scanners vuln -q \
            -f json -o "radd-$V-web-vulns.json" web
          python3 scripts/release_assets.py --tag "v$V" \
            "radd-$V-image-vulns.json" "radd-$V-web-vulns.json"
          echo "CRITICAL/HIGH summary (full detail in the release assets):"
          trivy convert -f table --severity CRITICAL,HIGH "radd-$V-image-vulns.json"
          trivy convert -f table --severity CRITICAL,HIGH "radd-$V-web-vulns.json"

      - name: Deploy instructions
        run: |
          IMG="${{ steps.meta.outputs.image }}:${{ steps.meta.outputs.version }}"
          echo "Pushed $IMG"
          echo
          echo "To deploy, set the tag in the deployment repo's values-radd.yaml:"
          echo "    image:"
          echo "      repository: ${{ steps.meta.outputs.image }}"
          echo "      tag: \"${{ steps.meta.outputs.version }}\""
          echo "…then push that repo; its CD applies the change."
          echo
          echo "No 'latest' tag is published on purpose — the cluster pins an"
          echo "immutable version, so a rollback is a value change in git rather"
          echo "than a race over what a moving tag currently points at."
