{{- include "radd.validate" . }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ .Release.Name }}-web
  labels:
    {{- include "radd.labels" . | nindent 4 }}
    app.kubernetes.io/component: web
spec:
  replicas: {{ .Values.replicas }}
  # ONE pod at a time, on purpose (RADD-1534). The default RollingUpdate starts the
  # new pod before stopping the old one: two processes then run every timer and
  # consumer at once, and a ReadWriteOnce volume can deadlock across nodes.
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/instance: {{ .Release.Name }}
      app.kubernetes.io/component: web
  template:
    metadata:
      labels:
        {{- include "radd.labels" . | nindent 8 }}
        app.kubernetes.io/component: web
    spec:
      {{- include "radd.imagePullSecrets" . | nindent 6 }}
      {{- with .Values.podSecurityContext }}
      securityContext: {{ toYaml . | nindent 8 }}
      {{- end }}
      containers:
        - name: radd
          image: {{ include "radd.image" . }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          # Migrations run via the chart Job (templates/job-migrate.yaml);
          # the image CMD's inline upgrade is skipped by overriding command.
          command: ["uvicorn"]
          args:
            - "--factory"
            - "radd.app:create_app"
            - "--host"
            - "0.0.0.0"
            - "--port"
            - "8000"
            {{- if gt (int .Values.web.processes) 1 }}
            - "--workers"
            - {{ .Values.web.processes | quote }}
            {{- end }}
          ports:
            - containerPort: 8000
          env:
            {{- include "radd.env" . | nindent 12 }}
            {{- if .Values.workers.enabled }}
            - name: RADD_RUN_WORKERS
              value: "false"
            {{- end }}
          {{- include "radd.envFrom" . | nindent 10 }}
          # Readiness asks the DATABASE (/ready runs a query): a pod that cannot
          # reach it must stop receiving traffic. Liveness stays on /health, which
          # deliberately does not: restarting a pod does not bring a database back.
          readinessProbe:
            httpGet:
              path: /ready
              port: 8000
            initialDelaySeconds: 3
            periodSeconds: 10
            failureThreshold: 3
          livenessProbe:
            httpGet:
              path: /health
              port: 8000
            initialDelaySeconds: 10
            periodSeconds: 30
          {{- with .Values.containerSecurityContext }}
          securityContext: {{ toYaml . | nindent 12 }}
          {{- end }}
          {{- with .Values.resources }}
          resources: {{ toYaml . | nindent 12 }}
          {{- end }}
          {{- include "radd.volumeMounts" . | nindent 10 }}
      {{- include "radd.volumes" . | nindent 6 }}
      {{- with .Values.dnsConfig }}
      dnsConfig: {{ toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.nodeSelector }}
      nodeSelector: {{ toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.tolerations }}
      tolerations: {{ toYaml . | nindent 8 }}
      {{- end }}
