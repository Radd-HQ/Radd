<!doctype html>
<html lang="en" class="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="icon" type="image/svg+xml" href="/brand/favicon.svg" />
    <link rel="icon" type="image/png" sizes="32x32" href="/brand/favicon-32.png" />
    <link rel="apple-touch-icon" href="/brand/apple-touch-icon.png" />
    <title>Radd</title>
    <!--
      Native-ESM module federation (spec 94): plugin remotes externalize the shared deps and keep
      bare `import ... from "react"` specifiers. This import map resolves those specifiers to the
      host's singleton shims under /shared/*.js (generated by scripts/gen-shared-shims.mjs), so a
      remote shares the host's React / query client / slot registry. The host's own bundle emits no
      bare specifiers at runtime, so the map never touches it — only remotes.
    -->
    <script type="importmap">
      {
        "imports": {
          "react": "/shared/react.js",
          "react/jsx-runtime": "/shared/react-jsx-runtime.js",
          "react/jsx-dev-runtime": "/shared/react-jsx-dev-runtime.js",
          "react-dom": "/shared/react-dom.js",
          "react-dom/client": "/shared/react-dom-client.js",
          "@tanstack/react-query": "/shared/tanstack-react-query.js",
          "@tanstack/react-router": "/shared/tanstack-react-router.js",
          "@radd/plugin-sdk": "/shared/radd-plugin-sdk.js"
        }
      }
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
