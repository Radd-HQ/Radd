{{- if .Values.workers.enabled }}
# One worker replica runs every background loop (webhooks, automations,
# notify, search, SLA, connectors). Consumers are single-writer by
# consumer-offset design — do not scale this deployment.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ .Release.Name }}-worker
  labels:
    {{- include "radd.labels" . | nindent 4 }}
    app.kubernetes.io/component: worker
spec:
  replicas: {{ .Values.workers.replicas }}
  # ONE pod at a time, on purpose (RADD-1534). The default RollingUpdate starts the
  # new pod before stopping the old one: two processes then run every timer and
  # consumer at once, and a ReadWriteOnce volume can deadlock across nodes.
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/instance: {{ .Release.Name }}
      app.kubernetes.io/component: worker
  template:
    metadata:
      labels:
        {{- include "radd.labels" . | nindent 8 }}
        app.kubernetes.io/component: worker
    spec:
      {{- include "radd.imagePullSecrets" . | nindent 6 }}
      {{- with .Values.podSecurityContext }}
      securityContext: {{ toYaml . | nindent 8 }}
      {{- end }}
      containers:
        - name: radd-worker
          image: {{ include "radd.image" . }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          command: ["uvicorn"]
          args: ["--factory", "radd.app:create_app", "--host", "0.0.0.0", "--port", "8000"]
          env:
            {{- include "radd.env" . | nindent 12 }}
            - name: RADD_RUN_WORKERS
              value: "true"
          {{- include "radd.envFrom" . | nindent 10 }}
          ports:
            - containerPort: 8000
          # Readiness asks the DATABASE (/ready runs a query): a pod that cannot
          # reach it must stop receiving traffic. Liveness stays on /health, which
          # deliberately does not: restarting a pod does not bring a database back.
          readinessProbe:
            httpGet:
              path: /ready
              port: 8000
            initialDelaySeconds: 3
            periodSeconds: 10
            failureThreshold: 3
          livenessProbe:
            httpGet:
              path: /health
              port: 8000
            initialDelaySeconds: 10
            periodSeconds: 30
          {{- with .Values.containerSecurityContext }}
          securityContext: {{ toYaml . | nindent 12 }}
          {{- end }}
          {{- with .Values.resources }}
          resources: {{ toYaml . | nindent 12 }}
          {{- end }}
          {{/* The backup scheduler is gated on run_workers (backup/scheduler.py),
               so THIS pod takes the nightly dumps — it needs the artifact volume
               as much as the web tier, which serves restores. */}}
          {{- include "radd.volumeMounts" . | nindent 10 }}
      {{- include "radd.volumes" . | nindent 6 }}
      {{- with .Values.dnsConfig }}
      dnsConfig: {{ toYaml . | nindent 8 }}
      {{- end }}
{{- end }}
