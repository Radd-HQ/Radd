[project]
name = "radd-sdk"
version = "0.1.0"
description = "Client SDK + plugin runner for Radd — out-of-process extensions and connectors"
readme = "README.md"
license = "Apache-2.0"
license-files = ["LICENSE"]
requires-python = ">=3.12"
dependencies = ["httpx>=0.27"]

[project.scripts]
radd-runner = "radd_sdk.cli:main"

[dependency-groups]
dev = ["pytest>=8"]

[build-system]
requires = ["uv_build>=0.11,<0.12"]
build-backend = "uv_build"
