# Contribution checks (RADD-1127). Runs on every pull request, on pushes to
# main and on demand — the same gates a release goes through, on GitHub's
# disposable runners. No secrets, read-only token: fork code executes here and
# nowhere near the cluster runner that holds deployment credentials.
name: checks

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch: {}
  workflow_call: {}

permissions:
  contents: read

concurrency:
  group: checks-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: backend (ruff, pytest)
    runs-on: ubuntu-latest
    services:
      # Plain postgres:16, not the pgvector image the dev stack uses: the
      # pgvector migration is guarded and the pgvector-dependent tests self-skip
      # on a plain server — the same thing a contributor's laptop runs.
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: radd
          POSTGRES_PASSWORD: radd
          POSTGRES_DB: radd_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U radd -d radd_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
          cache-dependency-glob: server/uv.lock
      - name: Install
        working-directory: server
        run: uv sync --locked
      - name: Lint (ruff)
        working-directory: server
        run: uv run ruff check src
      - name: Test (pytest)
        working-directory: server
        env:
          # conftest re-creates and migrates this throwaway database itself.
          RADD_TEST_DATABASE_URL: postgresql+psycopg://radd:radd@localhost:5432/radd_test
        run: uv run pytest -q

  frontend:
    name: frontend (tests, host + plugin builds, Chromium smoke)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Install
        working-directory: web
        run: npm ci
      # `npm run check` = the JS regressions, the host build, every plugin
      # remote's build, then the browser smoke and autocomplete proofs. The
      # runner image ships Google Chrome at the path web/scripts/lib/chrome.mjs
      # probes; RADD_CHROME pins it so a runner image change fails loudly here
      # rather than silently picking another binary.
      - name: Check
        working-directory: web
        env:
          RADD_CHROME: /usr/bin/google-chrome
        run: npm run check
