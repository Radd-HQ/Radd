# Build the CI/CD runner image and push it to the Forgejo registry (RADD-807).
#
#   deploy/ci-runner.Containerfile  ->  git.radd-hq.com/radd/ci-runner:<version>
#
# THIS IS THE ONLY JOB IN EITHER REPO THAT STILL DOWNLOADS A TOOL AT RUN TIME,
# and it cannot be otherwise: it is the job that builds the image the others
# use. The difference that matters is WHEN it runs — on a change to the image
# definition, not on every deploy and every release — so a bad day at
# download.docker.com is a red build of this image rather than a release that
# cannot ship.
#
# It lives in THIS repo rather than the deployment repo because the registry
# push needs a write:package credential, and `REGISTRY_TOKEN` already exists
# here. Consuming the image needs no credential at all: the Radd org is public,
# so the registry issues an anonymous pull token.
name: ci-image

on:
  push:
    branches: [main]
    paths:
      - "deploy/ci-runner.Containerfile"
      - "deploy/ci-runner.version"
      - ".forgejo/workflows/ci-image.yaml"
  workflow_dispatch: {}

env:
  REGISTRY: git.radd-hq.com
  IMAGE: git.radd-hq.com/radd/ci-runner

jobs:
  build:
    runs-on: docker
    container:
      # node:22-bookworm, NOT the ci-runner image — this job builds that image,
      # so depending on it would be a bootstrap cycle that breaks the moment the
      # image is broken, which is exactly when you need this job to run.
      image: node:22-bookworm
    steps:
      - uses: actions/checkout@v4

      - name: Install the docker CLI (bootstrap)
        run: |
          set -e
          curl -sSL --connect-timeout 20 --retry 3 --retry-delay 2 \
            https://download.docker.com/linux/static/stable/x86_64/docker-27.5.1.tgz \
            | tar xz -C /tmp docker/docker
          install -m 0755 /tmp/docker/docker /usr/local/bin/docker
          docker --version

      - name: Read the version
        id: meta
        run: |
          set -e
          V="$(tr -d '[:space:]' < deploy/ci-runner.version)"
          [ -n "$V" ] || { echo "deploy/ci-runner.version is empty"; exit 1; }
          echo "version=$V" >> "$GITHUB_OUTPUT"
          echo "Building $IMAGE:$V"

      - name: Log in to the registry
        run: |
          echo "${{ secrets.REGISTRY_TOKEN || secrets.FORGEJO_TOKEN }}" \
            | docker login "$REGISTRY" -u "${{ github.actor }}" --password-stdin

      # Tags are immutable here for the same reason the app image publishes no
      # `latest`: the runner image decides what every deploy executes, so
      # silently replacing 1.0.0 would mean two deploys pinned to "the same"
      # version ran different kubectl binaries. Bump the version file instead.
      - name: Refuse to overwrite an existing tag
        run: |
          set -e
          IMG="$IMAGE:${{ steps.meta.outputs.version }}"
          if docker manifest inspect "$IMG" > /dev/null 2>&1; then
            echo "$IMG already exists in the registry."
            echo "Bump deploy/ci-runner.version rather than moving a published tag."
            exit 1
          fi
          echo "$IMG is free"

      - name: Build
        # The daemon is the runner pod's DinD sidecar, reached over its bridge
        # gateway — job containers sit on that bridge, so localhost is not it.
        env:
          DOCKER_HOST: tcp://172.17.0.1:2375
        run: |
          set -e
          # Fed on stdin with NO build context: the Containerfile COPYs nothing,
          # so there is no directory to send. Passing `deploy/` would ship the
          # helm chart and the garage manifests to the daemon on every build for
          # no reason, and would silently start mattering if a COPY appeared.
          docker build -t "$IMAGE:${{ steps.meta.outputs.version }}" \
            - < deploy/ci-runner.Containerfile
          docker images "$IMAGE" --format '  {{.Repository}}:{{.Tag}}  {{.Size}}'

      - name: Push
        env:
          DOCKER_HOST: tcp://172.17.0.1:2375
        run: |
          docker push "$IMAGE:${{ steps.meta.outputs.version }}"

      - name: What to do with it
        run: |
          V="${{ steps.meta.outputs.version }}"
          echo "Pushed $IMAGE:$V"
          echo
          echo "Point the pipelines at it:"
          echo "  this repo    .forgejo/workflows/publish.yaml   container.image"
          echo "  deploy repo  .forgejo/workflows/deploy.yaml    container.image"
          echo
          echo "Both are pinned to an exact version on purpose — a moving tag"
          echo "would change what a deploy executes without a commit saying so."
