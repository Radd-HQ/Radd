# Dev-only single-node Garage (spec 102). Fixed secrets are fine HERE and only
# here — this file is for the compose `storage` profile on a developer machine.
metadata_dir = "/var/lib/garage/meta"
data_dir = "/var/lib/garage/data"
db_engine = "sqlite"

replication_factor = 1

rpc_bind_addr = "[::]:3901"
rpc_public_addr = "127.0.0.1:3901"
rpc_secret = "6472616464646576736563726574303030303030303030303030303030303030"

[s3_api]
s3_region = "garage"
api_bind_addr = "[::]:3900"
root_domain = ".s3.garage.localhost"

[admin]
api_bind_addr = "[::]:3903"
admin_token = "radd-dev-garage-admin"
